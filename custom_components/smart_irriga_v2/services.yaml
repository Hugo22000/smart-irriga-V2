set_zone_options:
  name: Modifier les options d'une zone
  description: >
    Met à jour le mode et la planification d'une zone d'irrigation
    sans passer par l'interface de configuration.
  fields:
    entry_id:
      name: ID de zone
      description: >
        L'identifiant unique de la zone
        (attribut entry_id du capteur next_irrigation).
      required: true
      example: "abc123def456"
      selector:
        text:
    activation_mode:
      name: Mode d'activation
      description: Mode de déclenchement de l'arrosage.
      required: true
      selector:
        select:
          options:
            - value: manual
              label: Manuel
            - value: schedule
              label: Planifié
            - value: humidity
              label: Capteur d'humidité
    schedule_time:
      name: Heure de planification
      description: Heure de déclenchement au format HH:MM ou HH:MM:SS.
      required: false
      example: "08:30"
      selector:
        time:
    schedule_days:
      name: Jours de planification
      description: Liste des jours (codes courts).
      required: false
      example: ["mon", "wed", "fri"]
      selector:
        select:
          multiple: true
          options:
            - value: mon
              label: Lundi
            - value: tue
              label: Mardi
            - value: wed
              label: Mercredi
            - value: thu
              label: Jeudi
            - value: fri
              label: Vendredi
            - value: sat
              label: Samedi
            - value: sun
              label: Dimanche
    humidity_threshold:
      name: Seuil d'humidité (%)
      description: Pourcentage en dessous duquel l'arrosage se déclenche.
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 5
          unit_of_measurement: "%"
    irrigation_duration:
      name: Durée d'arrosage (s)
      description: Durée de l'arrosage en secondes (minimum 1 s).
      required: true
      selector:
        number:
          min: 1
          max: 3600
          step: 1
          unit_of_measurement: s
